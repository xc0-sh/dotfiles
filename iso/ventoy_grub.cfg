# Ventoy F6 helper only. Both xc0 ISOs already contain their own guarded preseed.
menuentry "xc0 install cheat sheet (loki / thor)" --class=custom {
    clear
    echo "1. Select the correct host in Ventoy: loki testing/forky or thor stable/trixie."
    echo "2. Boot normal mode, then select the xc0 guarded base installer entry."
    echo "3. Enter the local marius password and a unique LUKS passphrase when asked."
    echo "4. Check the displayed live disk identity; type ERASE <live serial> exactly."
    echo "   This erases the selected OS disk. thor's WDS200T1X0E data disk is protected."
    echo "5. Successful completion powers off. Remove the USB before booting the disk."
    echo "6. This is a Debian base only, not a desktop installation."
    echo "   After first boot, read /etc/xc0-next-steps for the reviewed stage2 commands."
    echo
    echo -n "Press Enter to return ... "
    read vtInputKey
}

menuentry "Reboot" --class=custom {
    reboot
}

menuentry "Power off" --class=custom {
    halt
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "Reboot into UEFI firmware setup" --class=custom {
        fwsetup
    }
fi

menuentry "Return to Ventoy menu" --class=vtoyret VTOY_RET {
    echo "Return ..."
}

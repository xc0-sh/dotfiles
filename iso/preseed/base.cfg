# Stage 1: minimal signed Debian base, encrypted LVM on an explicitly authorized disk.
# Production passwords and LUKS passphrase are entered locally, not stored in the ISO.
# Fully unattended credentials are supported only by the isolated vm-test build mode.

### Locale, keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string NO
d-i localechooser/supported-locales multiselect en_US.UTF-8, nb_NO.UTF-8
d-i keyboard-configuration/xkb-keymap select no
d-i console-setup/ask_detect boolean false

# Non-d-i owners are exported by post-base-installer/05preseed to target debconf.
# The target package asks /variant even though the GUI labels it "Keyboard layout".
keyboard-configuration keyboard-configuration/layoutcode string no
keyboard-configuration keyboard-configuration/variant select Norwegian

### Host guard + hostname, then disk selection (scripts are in the initrd under /xc0).
# include_command, not early_command: the hostname must be stored as a preseed answer,
# because netcfg's questions do not exist yet when early_command runs.
d-i preseed/include_command string sh -eu /xc0/early.sh || { trap '' HUP INT TERM; echo 'xc0 BLOCKED: hardware validation failed' >&2; while :; do sleep 3600 || :; done; }
d-i partman/early_command string sh -eu /xc0/select-disk.sh || { trap '' HUP INT TERM; echo 'xc0 BLOCKED: disk validation failed' >&2; while :; do sleep 3600 || :; done; }

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

### Mirror and suite
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
# The base system always comes from the ISO's own release (trixie): debootstrap installs
# from the CD and ignores another mirror/suite. The testing profile upgrades in late.sh.
d-i mirror/suite string trixie
# Installer components (udebs) stay on the ISO's own release so they match its kernel.
# The weekly testing netinst of 2026-11-02 shipped a 7.2.14 kernel with 7.2.15 modules
# (dm_mod "version magic" mismatch), which breaks Ventoy and encrypted LVM.
d-i mirror/udeb/suite string trixie
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true

### Accounts
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Marius
d-i passwd/username string marius
# early.sh pins UID 1001; accounts.sh creates both named primary groups first.

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Oslo
d-i clock-setup/ntp boolean true

### Partitioning: the host-specific expert recipe is emitted by early.sh.
d-i partman-auto/method string crypto
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string xcloud_vg
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-basicfilesystems/no_swap boolean false
# Destructive confirmations are set by select-disk.sh only after identity and consent.

### Packages: base only. Run the Git scripts AFTER installation and first boot.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl git ca-certificates keyboard-configuration console-setup btrfs-progs cryptsetup-initramfs lvm2 diffutils grub-efi-amd64-signed shim-signed
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

### Finish: power off instead of rebooting, so a stick left in cannot start a second install
d-i preseed/late_command string sh -eu /xc0/btrfs.sh && cp /xc0/late.sh /target/root/xc0-late.sh && cp /xc0/accounts.sh /target/root/xc0-accounts.sh && cp /xc0/install.conf /target/root/xc0-install.conf && cp /xc0/authorized_keys /target/root/xc0-authorized_keys && in-target sh /root/xc0-late.sh || { trap '' HUP INT TERM; echo 'xc0 BLOCKED: base install failed; inspect /target/var/log/xc0-install.log and /tmp/xc0-btrfs.log' >&2; while :; do sleep 3600 || :; done; }
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false
d-i debian-installer/exit/poweroff boolean true

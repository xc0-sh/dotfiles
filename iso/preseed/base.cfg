# Stage-1 answer file: a minimal Debian base, encrypted LVM on the one internal disk.
# Secrets (LUKS passphrase, password hash, Wi-Fi) are NOT in this file: iso/build.sh
# appends them from a directory outside the repository. Profile values (@@...@@) are
# filled in by build.sh.

### Locale, keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string NO
d-i localechooser/supported-locales multiselect en_US.UTF-8, nb_NO.UTF-8
d-i keyboard-configuration/xkb-keymap select no
d-i console-setup/ask_detect boolean false

### Host guard + hostname, then disk selection (scripts are in the initrd under /xc0)
d-i preseed/early_command string sh /xc0/early.sh
d-i partman/early_command string sh /xc0/select-disk.sh

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

### Mirror and suite
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string @@SUITE@@
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true

### Accounts
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Marius
d-i passwd/username string marius

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Oslo
d-i clock-setup/ntp boolean true

### Partitioning: guided, encrypted LVM, whole disk (disk chosen by select-disk.sh)
d-i partman-auto/method string crypto
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-crypto/weak_passphrase boolean true
d-i partman-crypto/confirm boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Packages: base only. The desktop comes from git in stage 2.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl git ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

### Finish: power off instead of rebooting, so a stick left in cannot start a second install
d-i preseed/late_command string cp /xc0/late.sh /target/root/xc0-late.sh; in-target sh /root/xc0-late.sh
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false
d-i debian-installer/exit/poweroff boolean true

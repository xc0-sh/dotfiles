# Same encrypted-LVM envelope as thor, without a separate ext4 /boot or swap LV.
d-i partman-auto/choose_recipe select xc0-loki-crypto-btrfs
d-i partman-auto/expert_recipe string \
    xc0-loki-crypto-btrfs :: \
        1075 1075 1075 free \
            $iflabel{ gpt } method{ efi } format{ } mountpoint{ /boot } \
        . \
        8000 100000 -1 btrfs \
            $lvmok{ } lv_name{ root } method{ format } format{ } \
            use_filesystem{ } filesystem{ btrfs } mountpoint{ / } \
        .

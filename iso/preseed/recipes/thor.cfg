# Adapted from fenrir's tested encrypted-LVM recipe: no explicit PV/in_vg block.
# partman uses decimal MB; 1075 MB yields a 1 GiB partition after its alignment.
d-i partman-auto/choose_recipe select xc0-thor-crypto-btrfs
d-i partman-auto/expert_recipe string \
    xc0-thor-crypto-btrfs :: \
        1075 1075 1075 free \
            $iflabel{ gpt } method{ efi } format{ } \
        . \
        1075 1075 1075 ext4 \
            $primary{ } $bootable{ } method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } mountpoint{ /boot } \
        . \
        8000 100000 -1 btrfs \
            $lvmok{ } lv_name{ root } method{ format } format{ } \
            use_filesystem{ } filesystem{ btrfs } mountpoint{ / } \
        .

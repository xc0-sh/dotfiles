# Packaged lightweight graphical login, no autologin or embedded credentials.
# Xorg is used only for the greeter; the single offered desktop is Wayland/UWSM.
[General]
DisplayServer=x11

[Theme]
Current=maui

[Wayland]
SessionDir=/usr/local/share/xc0-desktop/wayland-sessions

[X11]
SessionDir=/usr/local/share/xc0-desktop/xsessions
